[project]
name = "sky-v1-omni"
version = "0.1.0a1"
description = "sky-v1: 5-modal (Text/Image/3D/Video/Audio) Omni Model - M1 Agent System"
requires-python = ">=3.10"
authors = [{name = "sky-v1 Team"}]
dependencies = [
    "pydantic>=2.5,<3",
    "omegaconf>=2.3,<3",
    "pyyaml>=6.0,<7",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "httpx>=0.27,<1",
    "chromadb>=0.4.22,<0.6",
    "numpy>=1.24,<2",
    "tenacity>=8.2,<9",
    "rich>=13.7,<14",
    "typing-extensions>=4.9,<5",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9", "pytest-asyncio>=0.23,<1", "pytest-cov>=4.1,<6"]
dev = ["mypy>=1.8", "flake8>=7.0", "isort>=5.13"]
embed = ["sentence-transformers>=2.5", "onnxruntime>=1.17"]

[project.scripts]
skyv1-rag-ingest = "scripts.rag.ingest_knowledge:main"
skyv1-agent-server = "scripts.agent.start_agent_server:main"
skyv1-sync-github = "scripts.data.sync_github_repos_to_rag:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sky_v1*"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --tb=short -q"
markers = ["slow: marks tests as slow"]
