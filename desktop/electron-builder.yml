appId: ai.skyv1.desktop
productName: Sky V1 Omni Desktop
directories:
  output: release
files:
  - "dist/**/*"
  - "package.json"
extraResources:
  - from: build/
    to: build/
    filter: ["**/*"]
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.developer-tools
  icon: build/icon.icns
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
linux:
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
  category: Development
  icon: build/icon.png
publish:
  provider: github
  owner: your-org
  repo: sky-v1-omni
